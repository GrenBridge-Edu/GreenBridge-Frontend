name: Deploy Frontend

on:
  push:
    branches:
      - main

jobs:
  deploy:
    runs-on: self-hosted

    steps:
      - uses: actions/checkout@v4

      - name: Install dependencies
        run: npm install

      - name: Build
        run: npm run build

      - name: Deploy to nginx
        run: |
          sudo rm -rf /var/www/greenbridge-frontend/*
          sudo cp -r dist/* /var/www/greenbridge-frontend/